<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>████████</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Mono:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
    
    <style>
        body {
            /* Fuente limpia y monoespaciada */
            font-family: 'Space Mono', monospace;
            background-color: #020202; /* Casi negro puro */
            color: #a3a3a3; /* Gris claro/apagado */
            overflow: hidden;
            margin: 0;
            padding: 0;
            user-select: none; /* Evita seleccionar el texto para más inmersión */
        }

        /* Líneas de escaneo CRT extremadamente sutiles */
        .scanlines {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: linear-gradient(
                to bottom,
                rgba(255, 255, 255, 0),
                rgba(255, 255, 255, 0) 50%,
                rgba(0, 0, 0, 0.15) 50%,
                rgba(0, 0, 0, 0.15)
            );
            background-size: 100% 4px;
            pointer-events: none;
            z-index: 50;
            opacity: 0.6;
        }

        /* Parpadeo apenas imperceptible */
        .flicker {
            animation: flicker-animation 0.2s infinite alternate;
        }

        @keyframes flicker-animation {
            0% { opacity: 0.98; }
            100% { opacity: 1; }
        }

        /* Cursor parpadeante clásico */
        .cursor {
            display: inline-block;
            width: 10px;
            height: 1.1em;
            background-color: #a3a3a3;
            vertical-align: text-bottom;
            animation: blink 1s step-end infinite;
            margin-left: 4px;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }
    </style>
</head>
<body class="flex flex-col items-center justify-center min-h-screen relative p-4 flicker">
    
    <!-- Capa de efecto visual CRT -->
    <div class="scanlines"></div>

    <div class="z-10 w-full max-w-5xl mx-auto flex flex-col items-center text-center space-y-16">
        
        <!-- Bloque superior (Top text y subtítulo) -->
        <div id="header-container" class="space-y-6">
            <h1 class="text-2xl md:text-3xl tracking-[0.3em] opacity-80">
                ████████
            </h1>
            <p class="text-lg md:text-xl text-gray-500 tracking-widest uppercase">
                Desencriptando<span class="cursor"></span>
            </p>
        </div>

        <!-- Contenedor del Contador (Sin bordes ni cajas) -->
        <div id="countdown-container" class="flex items-center justify-center space-x-2 md:space-x-8 w-full">
            
            <!-- Días -->
            <div class="flex flex-col items-center">
                <span id="days" class="text-6xl md:text-9xl font-bold tracking-tight text-gray-300">00</span>
                <span class="text-xs md:text-sm mt-4 tracking-[0.2em] text-gray-600">DÍAS</span>
            </div>
            
            <span class="text-4xl md:text-7xl font-light text-gray-700 pb-8 md:pb-12">:</span>

            <!-- Horas -->
            <div class="flex flex-col items-center">
                <span id="hours" class="text-6xl md:text-9xl font-bold tracking-tight text-gray-300">00</span>
                <span class="text-xs md:text-sm mt-4 tracking-[0.2em] text-gray-600">HORAS</span>
            </div>
            
            <span class="text-4xl md:text-7xl font-light text-gray-700 pb-8 md:pb-12">:</span>

            <!-- Minutos -->
            <div class="flex flex-col items-center">
                <span id="minutes" class="text-6xl md:text-9xl font-bold tracking-tight text-gray-300">00</span>
                <span class="text-xs md:text-sm mt-4 tracking-[0.2em] text-gray-600">MINUTOS</span>
            </div>
            
            <span class="text-4xl md:text-7xl font-light text-gray-700 pb-8 md:pb-12 md:flex hidden">:</span>

            <!-- Segundos (Oculto en móviles muy pequeños para que quepa bien, visible en md+) -->
            <div class="flex-col items-center md:flex hidden">
                <span id="seconds" class="text-6xl md:text-9xl font-bold tracking-tight text-gray-300">00</span>
                <span class="text-xs md:text-sm mt-4 tracking-[0.2em] text-gray-600">SEGUNDOS</span>
            </div>

        </div>
        
        <!-- Fila extra para los segundos en móviles -->
        <div id="mobile-seconds-container" class="flex flex-col items-center md:hidden mt-8">
            <span id="mobile-seconds" class="text-6xl font-bold tracking-tight text-gray-300">00</span>
            <span class="text-xs mt-4 tracking-[0.2em] text-gray-600">SEGUNDOS</span>
        </div>

        <!-- Mensaje de finalización -->
        <div id="unlocked-message" class="hidden absolute top-1/2 left-1/2 transform -translate-x-1/2 -translate-y-1/2 w-full">
            <h2 class="text-3xl md:text-5xl font-bold uppercase tracking-[0.3em] text-gray-200">
                SISTEMA DESBLOQUEADO
            </h2>
        </div>

    </div>

    <script>
        // Fecha objetivo: 10 de octubre de 2026 a las 18:00:00 UTC
        const targetDate = new Date("2026-10-10T18:00:00Z").getTime();

        // Elementos del DOM
        const daysEl = document.getElementById('days');
        const hoursEl = document.getElementById('hours');
        const minutesEl = document.getElementById('minutes');
        const secondsEl = document.getElementById('seconds');
        const mobileSecondsEl = document.getElementById('mobile-seconds');
        
        const headerContainer = document.getElementById('header-container');
        const countdownContainer = document.getElementById('countdown-container');
        const mobileSecondsContainer = document.getElementById('mobile-seconds-container');
        const unlockedMessage = document.getElementById('unlocked-message');

        // Formato para añadir el 0 delante (ej: 05)
        function formatNumber(num) {
            return num < 10 ? '0' + num : num;
        }

        // Bucle de actualización
        function updateCountdown() {
            const now = new Date().getTime();
            const distance = targetDate - now;

            const days = Math.floor(distance / (1000 * 60 * 60 * 24));
            const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
            const seconds = Math.floor((distance % (1000 * 60)) / 1000);

            daysEl.innerText = formatNumber(Math.max(0, days));
            hoursEl.innerText = formatNumber(Math.max(0, hours));
            minutesEl.innerText = formatNumber(Math.max(0, minutes));
            
            const formattedSeconds = formatNumber(Math.max(0, seconds));
            secondsEl.innerText = formattedSeconds;
            mobileSecondsEl.innerText = formattedSeconds;

            if (distance <= 0) {
                clearInterval(countdownInterval); 
                
                // Ocultar todo
                headerContainer.classList.add('hidden');
                countdownContainer.classList.add('hidden');
                mobileSecondsContainer.classList.add('hidden');
                
                // Mostrar texto final
                unlockedMessage.classList.remove('hidden');
            }
        }

        updateCountdown();
        const countdownInterval = setInterval(updateCountdown, 1000);
    </script>
</body>
</html>
